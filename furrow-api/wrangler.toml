name = "furrow-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the API from a browser
ALLOWED_ORIGINS = "https://cristilloarts.com,https://www.cristilloarts.com,http://localhost:8787,http://localhost:8000"

[[d1_databases]]
binding = "DB"
database_name = "furrow"
database_id = "REPLACE_AFTER_CREATE"   # filled in by `wrangler d1 create furrow`

# Secret, set in the Cloudflare dashboard (never in this file):
#   ANTHROPIC_API_KEY
